<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="src/styles/main.scss" />
        <link href="https://cdn.jsdelivr.net/npm/@vetixy/circular-std@1.0.0/dist/index.min.css" rel="stylesheet">

    </head>
    <body>
        <div class="container">
            <header>
                <div id="header-section">
                    <div><img src="/assets/appLogo.png" alt="Travlog-logo"></div>

                    <div id="hamburger">
                        <button><img src="/assets/hamburger.png" alt="hamburger-icon"></button>
                    </div>

                    <nav class="nav-menu">
                        <ul>
                            <li><a href="#home"><p>Home</p></a></li>
                            <li><a href="#discover"><p>Discover</p></a></li>
                            <li><a href="#special-deals"><p>Special Deals</p></a></li>
                            <li><a href="#contact"><p>Contact</p></a></li>
                            <li class="mob-nav-only"><a href="#Log-In"><p>Log In</p></a></li>
                            <li class="mob-nav-only"><a href="#Sign-Up"><p>Sign up</p></a></li>
                        </ul>
                    </nav>
                </div>

                <div id="login-sign-btns">
                    <button class="sec-btn">Log In</button>
                    <button class="pri-btn">Sign Up</button>
                </div>
            </header>
            <main>
                <section class="hero-section">
                    <article class="hero-section__img-section">
                        <img class="hero-section__img-section__location-icon" src="/assets/Frame 16.png" alt="location icon">
                        <img class="hero-section__img-section__connect-icon" src="/assets/Frame 17.png" alt="connect icon">
                        <img class="hero-section__img-section__top-places-icon" src="/assets/Frame 18.png" alt="top places icon">
                        <div class="hero-section__img-section__imgs">
                            <div class="hero-section__img-section__imgs__container1">
                                <div><img src="/assets/Rectangle 1.png" alt="Travel image at beach"></div>
                                <div><img src="/assets/Rectangle 2.png" alt="Travel image at mountains"></div>
                            </div>
                            <div class="hero-section__img-section__imgs__container2">
                                <div><img src="/assets/Rectangle 3.png" alt="Travel image at city"></div>
                            </div>
                        </div>
                    </article>

                    <div class="hero-section__content-section">
                        <h1 class="hero-section__content-section__heading1">Explore the world! <img src="/assets/work 1.png" alt="travel bag icon"></h1>
                        <h2 class="hero-section__content-section__heading2">Travel <span>top destination</span> of the world</h2>
                        <p class="hero-section__content-section__para">We always make our customer happy by providing as many choices as possible </p>
                    </div>
                </section>


            </main>
        </div>

        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
